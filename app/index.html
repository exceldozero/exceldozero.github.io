<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Excel do Zero</title>
<meta name="description" content="Aprenda Excel praticando: simulador de planilha, missões com correção automática, profissões, quiz e consulta.">
<meta name="theme-color" content="#0A3D2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Excel do Zero">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>@font-face{font-family:'Inter';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/inter-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:800;font-style:normal;font-display:swap;src:url(fonts/inter-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Inter Tight';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/inter-tight-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Inter Tight';font-weight:800;font-style:normal;font-display:swap;src:url(fonts/inter-tight-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/jetbrains-mono-latin-600-normal.woff2) format('woff2')}
:root{
  --bg:#F4F5F7; --card:#FFFFFF; --ink:#1F2328; --ink2:#4B5563; --mut:#6B7280; --line:#E3E6EA; --line2:#D0D5DB;
  --xl:#217346; --xl-d:#185C37; --xl-l:#E9F5EE; --xl-t:#1D6B41;
  --gold:#E3A008; --gold1:#FEF6E0; --gold-t:#8A5A00; --red:#C8372D; --red1:#FDECEA; --blue:#2563EB; --blue1:#EAF1FE; --vio:#7C3AED; --vio1:#F1EAFE;
  --g-hdr:#F3F3F3; --g-line:#E1E1E1; --g-hdr-on:#D9D9D9; --g-in:rgba(33,115,70,.10); --todo:#FFF8E1;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06); --r:14px; --nav:62px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#17191C; --card:#212428; --ink:#E8EAED; --ink2:#B8BEC6; --mut:#8D949E; --line:#30343A; --line2:#3B4047;
  --xl-l:#1C3327; --xl-t:#6FCF97; --gold1:#3A3014; --gold-t:#F2C94C; --red1:#3D2220; --blue1:#1B2A45; --vio1:#2A2145;
  --g-hdr:#2A2D32; --g-line:#34383E; --g-hdr-on:#3C4148; --g-in:rgba(111,207,151,.14); --todo:#3A3418; --shadow:0 4px 18px rgba(0,0,0,.35); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#17191C; --card:#212428; --ink:#E8EAED; --ink2:#B8BEC6; --mut:#8D949E; --line:#30343A; --line2:#3B4047;
  --xl-l:#1C3327; --xl-t:#6FCF97; --gold1:#3A3014; --gold-t:#F2C94C; --red1:#3D2220; --blue1:#1B2A45; --vio1:#2A2145;
  --g-hdr:#2A2D32; --g-line:#34383E; --g-hdr-on:#3C4148; --g-in:rgba(111,207,151,.14); --todo:#3A3418; --shadow:0 4px 18px rgba(0,0,0,.35); color-scheme:dark; }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--bg); color:var(--ink); font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased; font-feature-settings:"cv11","ss01"}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
body.pc{padding-bottom:0}
button{font:inherit; cursor:pointer; color:inherit}
a{color:var(--xl-t)}
code{font-family:'JetBrains Mono',Consolas,ui-monospace,Menlo,monospace; font-size:.88em; background:var(--bg); border:1px solid var(--line); padding:1px 5px; border-radius:5px}
kbd{font-family:inherit; font-size:11.5px; font-weight:600; background:var(--card); border:1px solid var(--line2); border-bottom-width:2px; border-radius:5px; padding:0 5px; color:var(--ink2); white-space:nowrap}

/* topo */
.top{position:sticky; top:0; z-index:40; background:var(--xl); color:#fff; display:flex; align-items:center; gap:10px; padding:8px 16px; padding-top:calc(8px + env(safe-area-inset-top)); height:calc(52px + env(safe-area-inset-top))}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; flex:1; min-width:0; cursor:pointer; font-size:17px}
.brand .logo{width:30px; height:30px; border-radius:7px; background:#fff; color:var(--xl); display:grid; place-items:center; font-weight:900; font-size:13px; flex:0 0 30px}
.brand span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand em{font-style:normal; font-weight:400; opacity:.9}
.top .xpchip{background:rgba(255,255,255,.16); border-radius:20px; padding:4px 11px; font-size:13px; font-weight:700; white-space:nowrap}
.iconbtn{background:rgba(255,255,255,.14); border:0; height:34px; border-radius:8px; display:flex; align-items:center; gap:6px; padding:0 10px; font-size:14px; color:#fff; font-weight:600}
@media (max-width:420px){ .brand{font-size:15.5px} .iconbtn span{display:none} }

/* navegação */
.nav{position:fixed; bottom:0; left:0; right:0; z-index:40; background:var(--card); border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom)}
.nav a{flex:1; text-decoration:none; color:var(--mut); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; height:var(--nav); font-size:11px; font-weight:600}
.nav a svg{width:22px; height:22px}
.nav a.on{color:var(--xl-t)}
body.pc .nav{position:sticky; top:52px; bottom:auto; border-top:0; border-bottom:1px solid var(--line); justify-content:flex-start; padding:0 12px; gap:2px; z-index:39}
body.pc .nav a{flex:0 0 auto; flex-direction:row; height:44px; padding:0 14px; font-size:14px; gap:8px}
body.pc .nav a svg{width:18px; height:18px}
body.pc .nav a.on{box-shadow:inset 0 -3px 0 var(--xl)}

main{max-width:1180px; margin:0 auto; padding:18px 16px}
.screen{animation:fade .2s ease}
@keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
h1{font-size:24px; line-height:1.2; margin:2px 0 10px; letter-spacing:-.015em}
h2{font-size:17px; margin:24px 0 10px}
.sub{color:var(--ink2); margin:-4px 0 16px}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; box-shadow:var(--shadow)}
.btn{border:0; border-radius:10px; padding:11px 16px; font-weight:600; background:var(--xl); color:#fff; display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px}
.btn:hover{background:var(--xl-d)}
.btn.gold{background:var(--gold); color:#2A1D05}
.btn.ghost{background:var(--card); color:var(--ink); border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--bg)}
.btn.block{width:100%}
.btn.small{min-height:36px; padding:6px 12px; font-size:14px; border-radius:8px}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:3px 9px; border-radius:20px; background:var(--xl-l); color:var(--xl-t)}
.pill.gold{background:var(--gold1); color:var(--gold-t)}
.muted{color:var(--mut)}
.bar{height:8px; background:var(--line); border-radius:8px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--xl); border-radius:8px; transition:width .6s}

/* início */
.hero{display:grid; gap:16px; grid-template-columns:1fr; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:var(--shadow); position:relative; overflow:hidden}
.hero:before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--xl)}
.hero .rank{font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--xl-t)}
.hero h1{margin:4px 0 10px}
.stats{display:flex; gap:22px; margin-top:12px; font-size:13.5px; color:var(--mut); flex-wrap:wrap}
.stats b{color:var(--ink); font-size:20px; display:block; line-height:1.2}
.cont{display:flex; gap:14px; align-items:center}
.cont .big{width:50px; height:50px; border-radius:12px; display:grid; place-items:center; font-size:24px; background:var(--xl-l); flex:0 0 50px}
.cont .big.gold{background:var(--gold1)}
.quick{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
@media (min-width:700px){ .quick{grid-template-columns:repeat(4,1fr)} }
.quick button{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; text-align:left; box-shadow:var(--shadow)}
.quick button:hover{border-color:var(--xl)}
.quick .qi{font-size:22px; display:block; margin-bottom:4px}
.quick b{display:block; font-size:15px}
.quick small{color:var(--mut)}
.badges{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px}
.badge{flex:0 0 auto; width:90px; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 6px; font-size:11px; color:var(--mut)}
.badge .bi{font-size:24px; display:block; filter:grayscale(1); opacity:.3}
.badge.on{color:var(--ink); border-color:var(--gold)}
.badge.on .bi{filter:none; opacity:1}
.tip{background:var(--gold1); border-radius:12px; padding:12px 14px; display:flex; gap:10px; color:var(--ink)}
.install{background:var(--blue1); border-radius:12px; padding:12px 14px; font-size:14px}

/* trilha */
.lvl{margin-bottom:24px}
.lvl-h{display:flex; align-items:center; gap:10px; margin-bottom:6px}
.lvl-h .dot{width:10px; height:10px; border-radius:3px}
.lvl-h h2{margin:0; flex:1}
.mlist{display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.mcard{display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 14px; text-align:left; width:100%}
.mcard:hover{border-color:var(--xl)}
.mcard .st{width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-weight:700; flex:0 0 32px; background:var(--bg); color:var(--mut); border:2px solid var(--line2); font-size:14px}
.mcard.done .st{background:var(--xl); border-color:var(--xl); color:#fff}
.mcard.next{border-color:var(--gold); box-shadow:0 0 0 3px var(--gold1)}
.mcard.next .st{border-color:var(--gold); color:var(--gold-t)}
.mcard .mt{flex:1; min-width:0}
.mcard .mt b{display:block; line-height:1.25; font-weight:600}
.mcard .mt small{color:var(--mut)}
.areas{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}
.area{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; text-align:left; position:relative}
.area:hover{border-color:var(--xl)}
.area .ai{font-size:28px; display:block; margin-bottom:6px}
.area b{display:block; line-height:1.25; font-weight:600}
.area.done:after{content:"✓"; position:absolute; top:10px; right:12px; width:22px; height:22px; border-radius:50%; background:var(--xl); color:#fff; font-size:13px; display:grid; place-items:center; font-weight:800}
.area.mine{border-color:var(--gold); box-shadow:0 0 0 3px var(--gold1)}

/* missão */
.mission{display:grid; gap:14px}
@media (min-width:1000px){ body.pc .mission{grid-template-columns:350px 1fr; align-items:start} body.pc .mission .mpanel{position:sticky; top:112px} }
.mhead{display:flex; align-items:center; gap:10px; margin-bottom:8px}
.mhead h1{margin:0; font-size:20px; flex:1}
.back{border:1px solid var(--line2); background:var(--card); width:38px; height:38px; border-radius:10px; font-size:18px; flex:0 0 38px}
.mpanel .intro{color:var(--ink2); font-size:15px}
.steps{margin:10px 0 0; padding:0; list-style:none; counter-reset:s}
.steps li{counter-increment:s; position:relative; padding:0 0 10px 32px; font-size:14.5px}
.steps li:before{content:counter(s); position:absolute; left:0; top:1px; width:22px; height:22px; border-radius:50%; background:var(--xl-l); color:var(--xl-t); font-size:12px; font-weight:800; display:grid; place-items:center}
.sechead{font-weight:800; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); margin-top:12px}
.goals{list-style:none; margin:8px 0 0; padding:0}
.goals li{display:flex; gap:10px; align-items:flex-start; padding:9px 10px; border-radius:10px; background:var(--bg); margin-bottom:6px; font-size:14.5px; border:1px solid transparent; transition:background .3s}
.goals li.cur{border-color:var(--gold); background:var(--gold1)}
.goals li .ck{width:21px; height:21px; border-radius:6px; border:2px solid var(--line2); flex:0 0 21px; display:grid; place-items:center; font-size:12px; color:transparent; margin-top:1px; background:var(--card)}
.goals li.ok{background:var(--xl-l)}
.goals li.ok .ck{background:var(--xl); border-color:var(--xl); color:#fff}
.toggle{background:none; border:0; color:var(--xl-t); font-weight:600; padding:6px 0; font-size:14px}
.hintbox{background:var(--gold1); border-radius:10px; padding:10px 12px; margin-top:10px; font-size:14px}
.modebox{background:var(--blue1); border-radius:10px; padding:9px 12px; margin-top:10px; font-size:13.5px}

/* ============ PLANILHA ============ */
.sv{background:var(--card); border:1px solid var(--line2); border-radius:10px; overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column; position:relative; outline:none}
/* faixa de opções */
.sv-ribbon{background:var(--card); border-bottom:1px solid var(--line)}
.rtabs{display:flex; align-items:center; gap:14px; padding:6px 12px 0; font-size:13px}
.rtabs .on{color:var(--xl-t); font-weight:600; border-bottom:3px solid var(--xl); padding-bottom:5px}
.rtabs .rhint{color:var(--mut); font-size:12px; padding-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rbody{display:flex; gap:0; padding:6px 6px 2px; overflow-x:auto; background:var(--bg)}
.rg{display:flex; flex-direction:column; padding:0 8px; border-right:1px solid var(--line)}
.rg:last-child{border-right:0}
.rb{display:flex; gap:2px; align-items:stretch; flex:1}
.rb .col{display:flex; flex-direction:column; gap:2px}
.rt{font-size:11px; color:var(--mut); text-align:center; padding:2px 0 3px; white-space:nowrap}
.rb button{border:1px solid transparent; background:none; border-radius:5px; display:flex; align-items:center; gap:5px; padding:3px 7px; font-size:12.5px; white-space:nowrap; color:var(--ink)}
.rb button:hover{background:var(--g-hdr-on); border-color:var(--line2)}
.rb button.on{background:var(--xl-l); border-color:var(--xl)}
.rb button .ri{font-size:15px; min-width:16px; text-align:center}
.rb button.big{flex-direction:column; gap:1px; padding:3px 9px; justify-content:center}
.rb button.big .ri{font-size:22px}
/* barra de fórmulas */
.sv-bar{display:flex; align-items:stretch; border-bottom:1px solid var(--line); background:var(--card); min-height:38px}
.sv.mob .sv-bar{min-height:46px}
.sv-name{min-width:78px; padding:0 8px; display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--ink); border-right:1px solid var(--line); font-family:'JetBrains Mono',Consolas,ui-monospace,monospace}
.sv-fx{width:32px; display:flex; align-items:center; justify-content:center; font-style:italic; font-family:Georgia,serif; color:var(--mut); border-right:1px solid var(--line)}
.sv-input{flex:1; min-width:0; border:0; background:var(--card); color:var(--ink); padding:0 10px; font:15px 'JetBrains Mono',Consolas,ui-monospace,Menlo,monospace; outline:none}
.sv.mob .sv-input{font-size:16px}
.sv-bar button{border:0; width:34px; font-size:15px; background:none; border-right:1px solid var(--line)}
.sv.mob .sv-bar button{width:44px; font-size:18px}
.sv-ok{color:var(--xl-t); font-weight:800} .sv-cancel{color:var(--red)}
.sv-bar:not(.editing) .sv-ok,.sv-bar:not(.editing) .sv-cancel{opacity:.25; pointer-events:none}
.sv.mob .sv-bar:not(.editing) .sv-ok,.sv.mob .sv-bar:not(.editing) .sv-cancel{display:none}
.sv.mob .sv-bar.editing .sv-ok{background:var(--xl); color:#fff}
.sv-help{font-size:12.5px; padding:5px 10px; background:var(--card); color:var(--ink2); border-bottom:1px solid var(--line); font-family:'JetBrains Mono',Consolas,ui-monospace,monospace; overflow-x:auto; white-space:nowrap; box-shadow:inset 3px 0 0 var(--blue)}
.sv-help .fnm{color:var(--blue); font-weight:700}
.sv-help.err{background:var(--red1); color:var(--red); font-family:inherit; white-space:normal; font-weight:600; box-shadow:inset 3px 0 0 var(--red)}
.sv-help:empty{display:none}
.sv-help .cur{background:var(--gold1); color:var(--gold-t); border-radius:3px; padding:0 3px; font-weight:700; outline:1px solid var(--gold)}
.sv-keys{display:none; gap:6px; overflow-x:auto; padding:6px 8px; border-bottom:1px solid var(--line); background:var(--bg); scrollbar-width:none; align-items:center}
.sv-keys.show{display:flex}
.sv-keys::-webkit-scrollbar{display:none}
.sv-keys button{flex:0 0 auto; min-width:40px; height:36px; border-radius:8px; border:1px solid var(--line2); background:var(--card); font-weight:700; font-family:'JetBrains Mono',Consolas,ui-monospace,monospace; font-size:15px; padding:0 10px; color:var(--ink)}
.sv.pc .sv-keys button{height:28px; font-size:12.5px; min-width:0}
.sv-keys button.fn{color:var(--blue); font-size:13px}
.sv-keys button.sug{background:var(--gold1); color:var(--gold-t); border-color:var(--gold); font-size:13px}
.sv-keys .lbl{flex:0 0 auto; font-size:12px; color:var(--mut); font-family:inherit; white-space:nowrap}
/* grade */
.sv-gridwrap{overflow:auto; max-height:min(60vh,560px); position:relative; background:var(--card); overscroll-behavior:contain}
.sv.tall .sv-gridwrap{height:calc(100dvh - 300px); max-height:none; min-height:320px}
.sv-inner{position:relative; display:inline-block; min-width:100%}
table.sv-grid{border-collapse:separate; border-spacing:0; font-size:14px; user-select:none; -webkit-user-select:none; font-family:Inter,Calibri,"Segoe UI",system-ui,sans-serif; font-size:13.5px}
.sv-grid th{position:sticky; top:0; z-index:3; background:var(--g-hdr); color:var(--ink2); font-weight:400; font-size:12.5px; height:24px; border-right:1px solid var(--g-line); border-bottom:1px solid var(--g-line); padding:0 4px; min-width:90px; cursor:default}
.sv-grid th.rh{position:sticky; left:0; z-index:2; min-width:42px; width:42px; text-align:center}
.sv-grid th.corner{left:0; z-index:4; min-width:42px; background:var(--g-hdr)}
.sv-grid th.on{background:var(--g-hdr-on); color:var(--xl-t); font-weight:700}
.sv-grid thead th.on{box-shadow:inset 0 -2px 0 var(--xl)}
.sv-grid th.rh.on{box-shadow:inset -2px 0 0 var(--xl)}
.sv-grid td{height:26px; min-width:90px; max-width:260px; padding:0 6px; border-right:1px solid var(--g-line); border-bottom:1px solid var(--g-line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:var(--card); cursor:cell}
.sv.mob .sv-grid td{height:34px}
.sv.mob .sv-grid th{height:28px}
.sv.mob .sv-grid th,.sv.mob .sv-grid td{min-width:74px}
.sv.mob .sv-grid th.rh,.sv.mob .sv-grid th.corner{min-width:34px; width:34px}
.sv-grid td.n{text-align:right; font-variant-numeric:tabular-nums}
.sv-grid td.e{color:var(--red); text-align:center}
.sv-grid td.b{font-weight:700}
.sv-grid td.h{font-weight:700}
.sv-grid td.todo{background:var(--todo)}
.sv-grid td.ok{background:var(--xl-l)}
.sv-grid td.in{background-image:linear-gradient(var(--g-in),var(--g-in))}
.sv-grid td.hint{position:relative}
.sv-grid td.hint::after{content:""; position:absolute; inset:1px; border:2px solid var(--gold); border-radius:2px; pointer-events:none; will-change:opacity; animation:hintfade 1.4s ease-in-out infinite}
@keyframes hintfade{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 0 2px transparent} 50%{box-shadow:inset 0 0 0 2px var(--gold)}}

.sv-selbox{position:absolute; display:none; border:2px solid var(--xl); pointer-events:none; z-index:1}

    sheets: [{ name: 'Cadastro', rows: [['Nome', 'Sobrenome', 'Nome completo', 'Veio do sistema', 'Corrigido'], ['Maria', 'Souza', '', '  MARIA   souza ', ''], ['João', 'Lima', '', 'joão    LIMA', ''], ['Carla', 'Dias', '', ' carla DIAS  ', '']], todo: ['C2:C4', 'E2:E4'], w: { C: 130, D: 150, E: 120 } }],
    goals: [{ t: 'Nome completo em C2:C4', cells: rng('C2', 'C4') }, { t: 'Cadastro corrigido em E2:E4', cells: rng('E2', 'E4'), fn: 'PRI.MAIÚSCULA' }],
    hint: '=A2&" "&B2 · =PRI.MAIÚSCULA(ARRUMAR(D2))', solve: { ...down('C2', 'C4', '=A2&" "&B2'), ...down('E2', 'E4', '=PRI.MAIÚSCULA(ARRUMAR(D2))') },
    why: 'Funções podem ficar uma dentro da outra: o Excel resolve de dentro para fora. Primeiro ARRUMAR, depois PRI.MAIÚSCULA.' },

  { id: 'i9', lvl: 'i', xp: 50, title: 'Contas com datas', start: 'D2',
    intro: 'Para o Excel, data é um número (dias desde 1900). Por isso dá para <b>subtrair datas</b> (dias entre elas) e <b>somar dias</b> a uma data (vencimentos).',
    steps: ['Em <b>D2</b>: =C2-B2 (dias entre a compra e o pagamento). Copie até D4.', 'Em <b>E2</b>: =B2+30 (vencimento em 30 dias). Copie até E4.'],
    sheets: [{ name: 'Prazos', rows: [['Cliente', 'Compra', 'Pagamento', 'Dias p/ pagar', 'Vencimento'], ['Loja A', '02/03/2026', '17/03/2026', '', ''], ['Loja B', '10/03/2026', '08/04/2026', '', ''], ['Loja C', '15/03/2026', '16/03/2026', '', '']], todo: ['D2:E4'], w: { B: 96, C: 96, D: 110, E: 100 } }],
    goals: [{ t: 'Dias entre compra e pagamento (D2:D4)', cells: rng('D2', 'D4') }, { t: 'Vencimento 30 dias após a compra (E2:E4)', cells: rng('E2', 'E4') }],
    hint: '=C2-B2 · =B2+30', solve: { ...down('D2', 'D4', '=C2-B2'), ...down('E2', 'E4', '=B2+30') },
    why: 'Com HOJE() você faz a mesma conta com a data atual: =B2-HOJE() mostra quantos dias faltam para vencer.' },

  /* ================= AVANÇADO ================= */
  { id: 'a1', lvl: 'a', xp: 60, title: 'PROCV: buscar em outra tabela', start: 'B2',
    intro: '<b>PROCV</b> procura um valor na primeira coluna de uma tabela e traz outra coluna da mesma linha: <code>=PROCV(o_que; tabela; nº_coluna; FALSO)</code>. O cadastro está na aba <b>Produtos</b>.',
    steps: ['Em <b>B2</b>, digite =PROCV(A2; e toque na aba <b>Produtos</b> embaixo.', 'Selecione A2:D6 (A2, botão :, D6) e toque em $ para travar.', 'Complete com ;2;FALSO) e confirme. Você volta sozinho para Pedidos.', 'Copie até B4. Em D2:D4, faça o mesmo com a coluna 4 (Preço).', 'Em E2:E4, calcule o total (Qtd × Preço).'],
    sheets: [{ name: 'Pedidos', rows: [['Código', 'Produto', 'Qtd', 'Preço', 'Total'], ['P03', '', 2, '', ''], ['P01', '', 1, '', ''], ['P05', '', 3, '', '']], fmt: { 'D2:E4': 'brl' }, todo: ['B2:B4', 'D2:E4'], w: { B: 110 } },
      { name: 'Produtos', rows: PRODUTOS, fmt: { 'D2:D6': 'brl' }, w: { B: 100, C: 100 } }],
    goals: [{ t: 'Nome do produto com PROCV (B2:B4)', cells: rng('B2', 'B4'), fn: 'PROCV' }, { t: 'Preço com PROCV (D2:D4)', cells: rng('D2', 'D4'), fn: 'PROCV' }, { t: 'Total do pedido (E2:E4)', cells: rng('E2', 'E4') }],
    hint: '=PROCV(A2;Produtos!$A$2:$D$6;2;FALSO) — para o preço, troque o 2 por 4.', solve: { ...down('B2', 'B4', '=PROCV(A2;Produtos!$A$2:$D$6;2;FALSO)'), ...down('D2', 'D4', '=PROCV(A2;Produtos!$A$2:$D$6;4;FALSO)'), ...down('E2', 'E4', '=C2*D2') },
    why: 'Nunca esqueça o FALSO no final: sem ele, o PROCV faz busca aproximada e pode trazer o preço de outro produto sem avisar.' },

  { id: 'a2', lvl: 'a', xp: 60, title: 'PROCV para faixas', start: 'C2',
    intro: 'Com <b>VERDADEIRO</b> no final, o PROCV busca <b>faixas</b>: encontra o maior valor que seja menor ou igual ao procurado. A tabela de faixas precisa estar em ordem crescente.',
    steps: ['Em <b>C2</b>: =PROCV(B2;$E$2:$F$5;2;VERDADEIRO).', 'Copie até C5. Vendas de 42.000 caem na faixa “a partir de 30.000” → 6%.'],
    sheets: [{ name: 'Comissão', rows: [['Vendedor', 'Vendas', 'Taxa', '', 'A partir de', 'Comissão'], ['Ana', 42000, '', '', 0, '2%'], ['Bruno', 8500, '', '', 10000, '4%'], ['Carla', 65000, '', '', 30000, '6%'], ['Diego', 18000, '', '', 60000, '8%']], fmt: { 'B2:B5': 'brl', 'C2:C5': 'pct', 'E2:E5': 'brl' }, todo: ['C2:C5'], w: { E: 100 } }],
    goals: [{ t: 'Taxa de comissão de cada vendedor (C2:C5)', cells: rng('C2', 'C5'), fn: 'PROCV' }],
    hint: '=PROCV(B2;$E$2:$F$5;2;VERDADEIRO)', solve: down('C2', 'C5', '=PROCV(B2;$E$2:$F$5;2;VERDADEIRO)'),
    why: 'Isso substitui um SE aninhado gigante e funciona para desconto por quantidade, alíquotas e faixas de frete.' },

  { id: 'a3', lvl: 'a', xp: 70, title: 'ÍNDICE + CORRESP', start: 'G2',
    intro: 'O PROCV só busca para a direita. A dupla <b>ÍNDICE + CORRESP</b> busca em qualquer direção: o CORRESP acha a <b>posição</b>; o ÍNDICE vai até ela. <code>=ÍNDICE(o_que_trazer; CORRESP(valor; onde_procurar; 0))</code>',
    steps: ['Em <b>G2</b>: =ÍNDICE($A$2:$A$6;CORRESP(F2;$B$2:$B$6;0)).', 'Copie para G3. Você achou o código a partir do nome — para a esquerda!'],
    sheets: [{ name: 'Produtos', rows: PRODUTOS.map((r, i) => [...r, '', ['Produto', 'Monitor', 'Headset'][i] || '', ['Código', '', ''][i] || '']), fmt: { 'D2:D6': 'brl' }, todo: ['G2:G3'], w: { B: 100, C: 100 } }],
    goals: [{ t: 'Código de cada produto buscado pelo nome (G2:G3)', cells: ['G2', 'G3'], fn: ['ÍNDICE'] }, { t: 'Usar CORRESP dentro do ÍNDICE', cells: ['G2'], fn: 'CORRESP' }],
    hint: '=ÍNDICE($A$2:$A$6;CORRESP(F2;$B$2:$B$6;0))', solve: down('G2', 'G3', '=ÍNDICE($A$2:$A$6;CORRESP(F2;$B$2:$B$6;0))'),
    why: 'Essa dupla funciona em todas as versões do Excel e não quebra quando alguém insere colunas na tabela.' },

  { id: 'a4', lvl: 'a', xp: 70, title: 'PROCX: a busca moderna', start: 'B2',
    intro: '<b>PROCX</b> (Excel 365 e 2021) substitui PROCV e ÍNDICE+CORRESP: <code>=PROCX(valor; onde_procurar; o_que_trazer; se_não_achar)</code>. Já é exata por padrão.',
    steps: ['Em <b>B2</b>: =PROCX(A2;Produtos!$A$2:$A$6;Produtos!$D$2:$D$6;"Não cadastrado").', 'Copie até B5. O código P99 não existe: aparece a mensagem, sem erro.'],
    sheets: [{ name: 'Consulta', rows: [['Código', 'Preço'], ['P02', ''], ['P04', ''], ['P99', ''], ['P01', '']], fmt: { 'B2:B5': 'brl' }, todo: ['B2:B5'], w: { B: 130 } },
      { name: 'Produtos', rows: PRODUTOS, fmt: { 'D2:D6': 'brl' }, w: { B: 100, C: 100 } }],
    goals: [{ t: 'Preço com PROCX, tratando o não encontrado (B2:B5)', cells: rng('B2', 'B5'), fn: 'PROCX' }],
    hint: '=PROCX(A2;Produtos!$A$2:$A$6;Produtos!$D$2:$D$6;"Não cadastrado")', solve: down('B2', 'B5', '=PROCX(A2;Produtos!$A$2:$A$6;Produtos!$D$2:$D$6;"Não cadastrado")'),
    why: 'Se o arquivo for aberto em Excel 2016/2019, use ÍNDICE+CORRESP. Se todos tiverem 365, PROCX é o mais simples.' },

  { id: 'a5', lvl: 'a', xp: 70, title: 'Conectando abas', start: 'B2',
    intro: 'Para usar uma célula de outra aba, escreva o nome da aba, ponto de exclamação e o endereço: <b>=Jan!B6</b>. É assim que se monta um resumo que junta vários meses.',
    steps: ['Em <b>B2</b> (aba Resumo), digite = e toque na aba <b>Jan</b>.', 'Toque em <b>B6</b> e confirme: a fórmula fica =Jan!B6.', 'Faça o mesmo para Fev (B3) e Mar (B4).', 'Em <b>B5</b>, some o trimestre.', 'Volte à aba Jan, mude um gasto e veja o Resumo mudar.'],
    sheets: [{ name: 'Resumo', rows: [['Mês', 'Total gasto'], ['Jan', ''], ['Fev', ''], ['Mar', ''], ['Trimestre', '']], fmt: { 'B2:B5': 'brl' }, todo: ['B2:B5'], w: { B: 110 } },

      { name: 'Fev', rows: [['Gasto', 'Valor'], ['Aluguel', 1800], ['Mercado', 1105], ['Transporte', 390], ['Lazer', 180], ['Total', '=SOMA(B2:B5)']], fmt: { 'B2:B6': 'brl' } },
      { name: 'Mar', rows: [['Gasto', 'Valor'], ['Aluguel', 1800], ['Mercado', 1320], ['Transporte', 455], ['Lazer', 520], ['Total', '=SOMA(B2:B5)']], fmt: { 'B2:B6': 'brl' } }],
    goals: [{ t: 'Puxe o total de cada mês das abas Jan, Fev e Mar (B2:B4)', cells: rng('B2', 'B4'), has: ['!'] }, { t: 'Total do trimestre em B5', cells: ['B5'] }],
    hint: '=Jan!B6 · =Fev!B6 · =Mar!B6 · =SOMA(B2:B4)', solve: { B2: '=Jan!B6', B3: '=Fev!B6', B4: '=Mar!B6', B5: '=SOMA(B2:B4)' },
    why: 'Esse é o esqueleto de qualquer sistema no Excel: abas de dados com a mesma estrutura e uma aba de resumo que puxa tudo.' },

  { id: 'a6', lvl: 'a', xp: 80, title: 'Relatório puxando outra aba', start: 'B2',
    intro: 'Agora combine SOMASE com outra aba: o Resumo calcula o total de cada vendedor olhando a aba <b>Vendas</b>. Trave os intervalos com $ para copiar.',

      { name: 'Vendas', rows: VENDAS, fmt: { 'E2:E7': 'brl', 'A2:A7': 'date' }, w: { A: 96 } }],
    goals: [{ t: 'Total de cada vendedor puxado da aba Vendas (B2:B4)', cells: rng('B2', 'B4'), fn: 'SOMASE', has: ['VENDAS!'] }],

  { id: 'x2', lvl: 'x', xp: 90, title: 'Projeto: controle de estoque', start: 'D2',

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* toque que não tira o foco do campo de fórmula */
function tapKeep(el, fn) {
  let sx = 0, sy = 0, moved = false, touched = 0;
  el.addEventListener('mousedown', e => e.preventDefault());
  el.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; moved = false; }, { passive: true });
  el.addEventListener('touchmove', e => { const t = e.touches[0]; if (Math.abs(t.clientX - sx) > 8 || Math.abs(t.clientY - sy) > 8) moved = true; }, { passive: true });
  el.addEventListener('touchend', e => { if (moved) return; e.preventDefault(); touched = Date.now(); fn(e); }, { passive: false });
  el.addEventListener('click', e => { if (Date.now() - touched < 600) return; fn(e); });
}

function wbFromSpec(sheets) {
  return {
    sheets: sheets.map(s => {
      const cells = {};
      s.rows.forEach((row, i) => row.forEach((v, j) => {
        if (v === '' || v === null || v === undefined) return;
        cells[XL.addr(i + 1, j + 1)] = { raw: typeof v === 'number' ? String(v).replace('.', ',') : String(v) };
      }));
      if (s.hdr !== false && s.rows.length) s.rows[0].forEach((v, j) => { const a = XL.addr(1, j + 1); if (cells[a]) cells[a].h = true; });
      for (const [r, f] of Object.entries(s.fmt || {})) {
        const [a, b] = r.split(':'); const A = XL.parseAddr(a), B = XL.parseAddr(b || a);
        for (let rr = A.r; rr <= B.r; rr++) for (let cc = A.c; cc <= B.c; cc++) { const k = XL.addr(rr, cc); (cells[k] = cells[k] || {}).fmt = f; }
      }
      const todo = [];
      for (const r of s.todo || []) { const [a, b] = r.split(':'); const A = XL.parseAddr(a), B = XL.parseAddr(b || a); for (let rr = A.r; rr <= B.r; rr++) for (let cc = A.c; cc <= B.c; cc++) todo.push(XL.addr(rr, cc)); }
      return { name: s.name, cells, todo, w: Object.assign({}, s.w || {}), rows: s.rows.length, cols: Math.max(...s.rows.map(r => r.length)) };
    }), active: 0
  };
}

class SheetView {
  constructor(root, wb, opts = {}) {
    this.root = root; this.wb = wb;
    this.o = Object.assign({ minRows: 12, minCols: 6, extraRows: 3, extraCols: 1, canAddSheet: false, tall: false, mode: 'pc' }, opts);
    this.mob = this.o.mode === 'mobile';
    this.eng = new XL.Engine(wb);
    this.view = wb.active || 0; this.act = { r: 1, c: 1 }; this.anchor = { r: 1, c: 1 };
    this.edit = null; this.undo = []; this.redo = []; this.clip = null; this.marks = {}; this.hintCells = [];
    this.lastIns = null; this.dragRef = null; this.drag = false; this.lastTouch = 0; this.showF = false; this.fillDrag = null;
    if (opts.start) { const p = XL.parseAddr(opts.start); if (p) { this.act = { ...p }; this.anchor = { ...p }; } }
    window.__sv = this;
    this.build();
  }
  get sh() { return this.wb.sheets[this.view]; }
  get sel() { return { r1: Math.min(this.act.r, this.anchor.r), c1: Math.min(this.act.c, this.anchor.c), r2: Math.max(this.act.r, this.anchor.r), c2: Math.max(this.act.c, this.anchor.c) }; }
  isMulti() { const s = this.sel; return s.r1 !== s.r2 || s.c1 !== s.c2; }
  dims(sh) {
    let r = Math.max(this.o.minRows, sh.rows || 0), c = Math.max(this.o.minCols, sh.cols || 0);
    for (const a in sh.cells) { const p = XL.parseAddr(a); if (p) { r = Math.max(r, p.r); c = Math.max(c, p.c); } }
    return { rows: r + this.o.extraRows, cols: Math.min(26, c + this.o.extraCols) };
  }

  /* ================= estrutura ================= */
  build() {
    const R = this.root;
    R.className = 'sv ' + (this.mob ? 'mob' : 'pc') + (this.o.tall ? ' tall' : '');
    R.innerHTML = `${this.mob ? '' : '<div class="sv-ribbon"></div>'}
      <div class="sv-bar"><div class="sv-name"></div>
      <button class="sv-cancel" aria-label="Cancelar" title="Cancelar (Esc)">${ic('x')}</button><button class="sv-ok" aria-label="Confirmar" title="Inserir (Enter)">${ic('check')}</button>
      <div class="sv-fx">fx</div>
      <input class="sv-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Barra de fórmulas"></div>
      <div class="sv-help"></div><div class="sv-keys"></div>
      <div class="sv-gridwrap"><div class="sv-inner"><table class="sv-grid"></table><div class="sv-selbox"><i class="sv-handle"></i></div><div class="sv-ants"></div><div class="sv-fillprev"></div></div></div>
      <div class="sv-foot"><div class="sv-tabs"></div><div class="sv-status"></div></div>
      ${this.mob ? '<div class="sv-tools"></div>' : ''}<div class="sv-menu" hidden></div>`;
    this.$ = s => R.querySelector(s);
    this.input = this.$('.sv-input'); this.bar = this.$('.sv-bar'); this.help = this.$('.sv-help'); this.keys = this.$('.sv-keys');
    this.wrap = this.$('.sv-gridwrap'); this.inner = this.$('.sv-inner'); this.table = this.$('.sv-grid');
    this.selbox = this.$('.sv-selbox'); this.handle = this.$('.sv-handle'); this.ants = this.$('.sv-ants'); this.fillprev = this.$('.sv-fillprev'); this.menu = this.$('.sv-menu');
    this.input.placeholder = this.mob ? 'Toque aqui para digitar' : 'Digite ou clique duas vezes na célula';
    tapKeep(this.$('.sv-ok'), () => this.commit(null));
    tapKeep(this.$('.sv-cancel'), () => this.cancel());
    this.input.addEventListener('focus', () => { if (!this.edit) this.startEdit(null, true); });
    this.input.addEventListener('input', () => this.onInput());
    this.input.addEventListener('keydown', e => this.onInputKey(e));
    this.input.addEventListener('click', () => this.onInput());
    this.input.addEventListener('keyup', e => { if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) this.onInput(); });
    this.bindGrid(); this.bindHandle();
    if (this.mob) this.buildMobTools(); else this.buildRibbon();
    R.tabIndex = -1;
    R.addEventListener('keydown', e => this.onGridKey(e));
    document.addEventListener('mousedown', this._docDown = e => { if (!this.menu.hidden && !this.menu.contains(e.target)) this.hideMenu(); });
    this.renderAll();
    requestAnimationFrame(() => this.scrollTo(this.act, true));
  }
  destroy() { document.removeEventListener('mousedown', this._docDown); }

  renderAll() { this.renderGrid(); this.renderTabs(); this.renderKeys(); this.refresh(); }
  renderGrid() {
    const sh = this.sh, d = this.dims(sh); this.d = d;
    let h = '<thead><tr><th class="corner" title="Selecionar tudo"></th>';
    for (let c = 1; c <= d.cols; c++) { const L = XL.n2col(c); const w = sh.w && sh.w[L]; h += `<th class="ch" data-c="${c}"${w ? ` style="min-width:${w}px;max-width:${w}px"` : ''}>${L}</th>`; }
    h += '</tr></thead><tbody>';
    for (let r = 1; r <= d.rows; r++) {
      h += `<tr><th class="rh" data-r="${r}">${r}</th>`;
      for (let c = 1; c <= d.cols; c++) { const w = sh.w && sh.w[XL.n2col(c)]; h += `<td data-r="${r}" data-c="${c}"${w ? ` style="min-width:${w}px;max-width:${w}px"` : ''}></td>`; }
      h += '</tr>';
    }
    this.table.innerHTML = h + '</tbody>';
    this.tds = {}; this.cellList = [];
    this.table.querySelectorAll('td').forEach(td => { const r = +td.dataset.r, c = +td.dataset.c, k = r + ',' + c; this.tds[k] = td; this.cellList.push({ td, r, c, k, a: XL.addr(r, c) }); });
    this.colThs = [...this.table.querySelectorAll('thead th.ch')].map(th => ({ th, c: +th.dataset.c }));
    this.rowThs = [...this.table.querySelectorAll('th.rh')].map(th => ({ th, r: +th.dataset.r }));
    this.vcache = {};
  }
  /* agenda um redesenho leve no próximo quadro (usado ao arrastar) */
  paintSoon() { if (this._raf) return; this._raf = requestAnimationFrame(() => { this._raf = 0; this.refresh(); }); }
  ensureSize(r, c) { if (r > this.d.rows - 1 || (c > this.d.cols - 1 && this.d.cols < 26)) { this.sh.rows = Math.max(this.sh.rows || 0, r); this.sh.cols = Math.max(this.sh.cols || 0, c); this.renderGrid(); } }
  fmtOf(sh, a) {
    const cell = sh.cells[a]; if (!cell) return '';
    if (cell.fmt) return cell.fmt;
    if (typeof cell.raw === 'string' && cell.raw[0] === '=') return this.eng.autoFmt(cell.raw, sh);

  /* ================= demonstração animada ("Mostre-me") ================= */
  async demo(addr, formula) {

/* ---------- missão ---------- */
function solvedWb(m) {
  const wb = wbFromSpec(m.sheets);
  for (const [k, f] of Object.entries(m.solve)) { let sh = wb.sheets[0], a = k; if (k.includes('!')) { const [s, c] = k.split('!'); sh = wb.sheets.find(x => x.name === s); a = c; } const cell = sh.cells[a] || {}; cell.raw = XL.normalize(f); sh.cells[a] = cell; }
  return wb;
}
function sameVal(a, b) {
  if (typeof a === 'number' && typeof b === 'number') return Math.abs(a - b) <= Math.max(1e-6, Math.abs(b) * 1e-9);
  if (typeof a === 'string' && typeof b === 'string') return a.trim().toLowerCase() === b.trim().toLowerCase();
  if (XL.isErr(a) || XL.isErr(b)) return false;
  return a === b;
}
/* ---------- simulado de teste de Excel ---------- */
let EXAM = null;
const EXAM_POOL = ['b4', 'b5', 'b7', 'i1', 'i2', 'i3', 'i4', 'i5', 'i6', 'i7', 'i9', 'a1', 'a2', 'a3', 'a4', 'x2', 'x3'];
const fmtClock = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
function startExam() {
  const order = id => EXAM_POOL.indexOf(id);
  const ids = [...EXAM_POOL].sort(() => Math.random() - .5).slice(0, 5).sort((a, b) => order(a) - order(b));
  EXAM = { ids, idx: 0, t0: Date.now(), dur: 15 * 60000, res: [] };
  go('missao/' + ids[0]);
}
function examNext(ok) {
  if (!EXAM) return;
  EXAM.res.push({ id: EXAM.ids[EXAM.idx], ok });
  EXAM.idx++;
  if (EXAM.idx >= EXAM.ids.length || Date.now() - EXAM.t0 >= EXAM.dur) go('simulado/resultado'); else go('missao/' + EXAM.ids[EXAM.idx]);
}
function viewExam(el, arg) {
  if (arg === 'resultado' && EXAM) {
    while (EXAM.res.length < EXAM.ids.length) EXAM.res.push({ id: EXAM.ids[EXAM.res.length], ok: false });
    const n = EXAM.res.filter(r => r.ok).length, used = Math.min(Date.now() - EXAM.t0, EXAM.dur);
    const xp = n * 15; if (xp) addXP(xp);
    S.examBest = Math.max(S.examBest || 0, n); if (n === 5) award('exam'); save();
    const msg = n === 5 ? 'Aprovado com nota máxima. Você está pronto para um teste de Excel de verdade.' : n >= 3 ? 'Aprovado. Revise as tarefas que ficaram para trás e tente de novo para gabaritar.' : 'Ainda não. Refaça as missões das tarefas que errou e volte aqui — cada tentativa sorteia tarefas novas.';
    el.innerHTML = `<div class="qwrap card" style="text-align:center"><div class="sechead">Resultado do simulado</div><div class="score" style="margin-top:8px">${n}/5</div>
      <p style="font-size:17px;font-weight:600;margin:10px 0">${msg}</p><p class="muted">Tempo: ${fmtClock(used)} · ${xp ? `+${xp} XP` : 'sem XP desta vez'}</p>
      <div style="text-align:left;margin:16px 0">${EXAM.res.map((r, i) => { const m = MISSIONS.find(x => x.id === r.id); return `<div class="kv"><span>${i + 1}. ${m.title}</span><span style="color:${r.ok ? 'var(--xl-t)' : 'var(--red)'}">${r.ok ? 'Correta' : '<a href="#/missao/' + m.id + '">Revisar</a>'}</span></div>`; }).join('')}</div>
      <div class="row" style="justify-content:center"><button class="btn" id="again">Fazer outro simulado</button><button class="btn ghost" onclick="go('home')">Voltar ao início</button></div></div>`;
    EXAM = null;
    $('#again', el).onclick = startExam;
    return;
  }
  el.innerHTML = `<div class="qwrap"><h1>Simulado de teste de Excel</h1><p class="sub">Muitas empresas aplicam um teste prático de Excel no processo seletivo. Treine aqui nas mesmas condições.</p>
    <div class="card"><div class="bigicon">${ic('timer')}</div>
    <ul class="checks-app"><li>${ic('check')}5 tarefas sorteadas: SOMA, SE, SOMASE, PROCV, referências e mais</li><li>${ic('check')}15 minutos no relógio</li><li>${ic('check')}Sem dica, sem “Mostre-me” e sem solução — como na entrevista</li><li>${ic('check')}Nota no final e +15 XP por tarefa correta</li></ul>
    <p class="muted" style="font-size:14px">Seu melhor resultado: <b>${S.examBest || 0}/5</b></p>
    <button class="btn block" id="go">Começar simulado</button></div></div>`;
  $('#go', el).onclick = startExam;
}

    timer = setInterval(() => { const left = exam.dur - (Date.now() - exam.t0); const c = $('#clock'); if (c) { c.textContent = fmtClock(left); c.classList.toggle('low', left < 120000); } if (left <= 0) { clearInterval(timer); toast('Tempo esgotado'); go('simulado/resultado'); } }, 500);

  }
  let pending = null;
  const check = sv => {
    const marks = {}; let all = true; pending = null;
    m.goals.forEach((g, i) => {
      const shU = g.sheet ? sv.wb.sheets.find(s => s.name === g.sheet) : sv.wb.sheets[0];
      const shS = g.sheet ? sol.sheets.find(s => s.name === g.sheet) : sol.sheets[0];
      const ok = g.cells.every(a => {
        const p = XL.parseAddr(a); const cell = shU.cells[a]; const raw = cell && cell.raw != null ? String(cell.raw) : '';

        }

  });
  check(sv); sv.refresh();
  function complete() {
    finished = true;
    if (exam) { clearInterval(timer); toast('Tarefa correta!'); setTimeout(() => examNext(true), 700); return; }
    if (S.dailyPending === id && S.dailyDone !== todayKey()) { S.dailyDone = todayKey(); delete S.dailyPending; addXP(10); setTimeout(() => toast('Desafio do dia concluído: +10 XP bônus'), 1200); }
    const first = !S.done[id]; let gained = 0;
    if (first) { gained = usedSol ? Math.round(m.xp / 2) : m.xp; S.done[id] = { t: Date.now(), sol: usedSol }; if (!usedSol) S.noHint++; addXP(gained); checkBadges(); } else { activity(); save(); }

      const md = modal(`<div class="celebrate"><div class="em ok">${ic('check')}</div><h2>Missão concluída!</h2>${gained ? `<div class="xp">+${gained} XP</div>` : '<p class="muted">Você já tinha concluído esta missão — ótimo treino!</p>'}<p style="text-align:left">${m.why}</p>
        <div class="row" style="justify-content:center">${nextM ? `<button class="btn" id="mNext">Próxima: ${nextM.title}</button>` : ''}<button class="btn ghost" data-close>Continuar explorando</button></div></div>`);
      const nb = $('#mNext', md.el); if (nb) nb.onclick = () => { md.close(); go('missao/' + nextM.id); };
    }, 450);
  }

  $('#bVid', el).onclick = () => openVideo(m);
  let demoing = false;
  $('#bShow', el).onclick = async () => {
    if (demoing) return;
    if (!pending) return toast('Tudo certo por aqui!');
    const key = pending.sheet ? pending.sheet + '!' + pending.cell : pending.cell;
    const f = m.solve[key];
    if (!f || pending.sheet || !String(f).startsWith('=')) { $('#bHint', el).click(); return; }
    if (sv.view !== 0) sv.switchSheet(0);
    demoing = true; $('#bShow', el).disabled = true;
    $('#hintbox', el).innerHTML = `<div class="hintbox">Veja como se faz em <b>${pending.cell}</b>. Depois, faça as próximas células você mesmo${m.goals[pending.goal].cells.length > 1 ? ' — copiando a fórmula ou arrastando a alça' : ''}.</div>`;
    try { await sv.demo(pending.cell, XL.normalize(f)); } finally { demoing = false; $('#bShow', el).disabled = false; }
  };
  $('#bSol', el).onclick = () => confirmBox('Ver a solução?', 'As respostas serão preenchidas na planilha. Se for sua primeira vez nesta missão, ela vale metade do XP. Dica: tente antes o botão Dica.', 'Mostrar solução', () => {
    usedSol = true; sv.snapshot();
    for (const [k, f] of Object.entries(m.solve)) { let sh = sv.wb.sheets[0], a = k; if (k.includes('!')) { const [s, c] = k.split('!'); sh = sv.wb.sheets.find(x => x.name === s); a = c; } const cell = sh.cells[a] || {}; cell.raw = XL.normalize(f); sh.cells[a] = cell; }

  });

    <div id="svroot"></div><p class="muted" style="font-size:13.5px;margin-top:10px">Tudo o que você fizer aqui fica salvo neste aparelho. ${mode() === 'pc' ? 'Funciona como o Excel: digite direto na célula, use os atalhos (Ctrl+C, Ctrl+V, Ctrl+Z, Ctrl+Shift+setas, F2, F4) e arraste a alça verde para preencher. Botão direito abre mais opções.' : 'Toque duas vezes numa célula para editar. Segure o dedo para selecionar várias e abrir o menu. Arraste a bolinha verde para preencher.'}</p>`;
  const sv = new SheetView($('#svroot', el), S.sandbox, { mode: mode(), minRows: 40, minCols: 10, extraRows: 10, canAddSheet: true, tall: true, onChange: v => { S.sandbox = v.wb; activity(); save(); } });
  $('#nova', el).onclick = () => confirmBox('Nova planilha?', 'O conteúdo atual será apagado.', 'Apagar e começar', () => { S.sandbox = blankWb(); save(); route(); });
  $('#csv', el).onclick = () => {
    const sh = sv.sh, d = sv.dims(sh); let maxR = 0, maxC = 0; for (const a in sh.cells) { const p = XL.parseAddr(a); if (p && sh.cells[a].raw != null) { maxR = Math.max(maxR, p.r); maxC = Math.max(maxC, p.c); } }
    if (!maxR) return toast('A aba está vazia');
    const lines = []; for (let r = 1; r <= maxR; r++) { const row = []; for (let c = 1; c <= maxC; c++) { const t = sv.display(sh, XL.addr(r, c), r, c).text; row.push(/[;"\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t); } lines.push(row.join(';')); }
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = sh.name + '.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $('#tpl', el).onclick = () => {
    const groups = [['Projetos', MISSIONS.filter(m => m.lvl === 'x')], ['Profissões', MISSIONS.filter(m => m.lvl === 'p')]];
    const md = modal(`<h2>Modelos prontos</h2><p class="muted">Abrem já com as fórmulas. Use como base e adapte para você.</p>${groups.map(([g, ms]) => `<h3 style="margin:14px 0 8px">${g}</h3>${ms.map(m => `<button class="mcard" data-m="${m.id}" style="margin-bottom:8px"><span class="st">${ic(m.area ? AREAS.find(a => a.id === m.area).icon : 'grid')}</span><span class="mt"><b>${m.title}</b><small>${m.area ? AREAS.find(a => a.id === m.area).nome : 'Projeto Expert'}</small></span><span>›</span></button>`).join('')}`).join('')}<button class="btn ghost block" data-close style="margin-top:8px">Fechar</button>`);
    md.el.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { md.close(); openTemplate(MISSIONS.find(m => m.id === b.dataset.m)); });
  };
  return { leave() { if (sv.edit) sv.commit(null); } };
}

/* ---------- quiz ---------- */
function viewQuiz(el) {
  const start = () => {
    const qs = [...QUIZ].sort(() => Math.random() - .5).slice(0, 10).map(q => { const order = [0, 1, 2, 3].sort(() => Math.random() - .5); return { q: q[0], opts: order.map(i => q[1][i]), a: order.indexOf(q[2]), exp: q[3] }; });
    let i = 0, score = 0;
    const show = () => {
      const q = qs[i];
      el.innerHTML = `<div class="qwrap"><div class="row" style="justify-content:space-between"><span class="pill">Pergunta ${i + 1} de 10</span><span class="pill" style="background:var(--gold1);color:#7a5310">Acertos: ${score}</span></div>
        <div class="bar" style="margin:12px 0 16px"><i style="width:${i * 10}%"></i></div><h2 style="margin-top:0;font-size:20px">${q.q}</h2>
        <div id="opts">${q.opts.map((o, k) => `<button class="qopt" data-k="${k}">${esc(o)}</button>`).join('')}</div><div id="after"></div></div>`;
      el.querySelectorAll('.qopt').forEach(b => b.onclick = () => {
        const k = +b.dataset.k; el.querySelectorAll('.qopt').forEach(x => { x.disabled = true; if (+x.dataset.k === q.a) x.classList.add('right'); });
        if (k === q.a) score++; else b.classList.add('wrong');
        $('#after', el).innerHTML = `<div class="qexp">${k === q.a ? '<b class="ok">Certo!</b> ' : '<b class="bad">Não foi dessa vez.</b> '}${q.exp}</div><button class="btn block" id="nx">${i < 9 ? 'Próxima' : 'Ver resultado'}</button>`;
        $('#nx', el).onclick = () => { i++; i < 10 ? show() : finish(); };
        $('#nx', el).scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      });
    };
    const finish = () => {
      const xp = score * 5; addXP(xp); if (score > S.quizBest) S.quizBest = score; if (score === 10) { award('quiz'); confetti(); } checkBadges(); save();
      el.innerHTML = `<div class="qwrap card" style="text-align:center"><div class="score">${score}/10</div><p style="font-size:18px;font-weight:700">${score === 10 ? 'Gabaritou!' : score >= 7 ? 'Mandou bem!' : score >= 4 ? 'Bom começo — revise e tente de novo.' : 'Faça as missões da trilha e volte aqui.'}</p><div class="celebrate"><span class="xp">+${xp} XP</span></div><p class="muted">Seu recorde: ${S.quizBest}/10</p><div class="row" style="justify-content:center"><button class="btn" id="again">Jogar de novo</button><button class="btn ghost" onclick="go('trilha')">Ir para a trilha</button></div></div>`;
      $('#again', el).onclick = start;
    };
    show();
  };
  el.innerHTML = `<div class="qwrap"><h1>Quiz relâmpago</h1><p class="sub">10 perguntas sorteadas de um banco de ${QUIZ.length}. Cada acerto vale 5 XP, e todas têm explicação.</p>
    <div class="card" style="text-align:center"><div class="bigicon">${ic('target')}</div><p>Seu recorde: <b>${S.quizBest}/10</b></p><button class="btn block" id="qs">Começar</button></div></div>`;
  $('#qs', el).onclick = start;
}

/* ---------- consulta ---------- */
function viewRef(el, tab) {
  tab = tab || 'funcoes';
  el.innerHTML = `<h1>Consulta rápida</h1><div class="tabs">${[['funcoes', 'Funções'], ['atalhos', 'Atalhos'], ['erros', 'Erros']].map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" onclick="go('consulta/${k}')">${l}</button>`).join('')}</div><div id="body"></div>`;
  const body = $('#body', el);
  if (tab === 'funcoes') {
    body.innerHTML = `<input class="search" id="q" placeholder="Buscar função (ex.: procv, soma, data)…" type="search"><div id="list"></div>`;
    const render = q => {
      const k = XL.strip(q || '').toLowerCase();
      const items = FUNCS.filter(f => !k || XL.strip(f[0] + ' ' + f[1] + ' ' + f[2] + ' ' + f[4]).toLowerCase().includes(k));
      $('#list', body).innerHTML = items.map((f, i) => `<div class="fnc"><div class="fh"><b>${esc(f[0])}</b><span class="pill">${esc(f[2])}</span><span class="pill" style="background:var(--blue1);color:var(--blue)">EN: ${esc(f[1])}</span></div>
        <div class="syn">${esc(f[3])}</div><div>${esc(f[4])}</div>${f[6] === false ? '<div class="muted" style="font-size:13px;margin-top:6px">Esta função existe no Excel 365/2021; ainda não está disponível no simulador.</div>' : `<div class="row" style="margin-top:8px"><code>${esc(f[5])}</code><button class="btn small ghost" data-t="${FUNCS.indexOf(f)}">Testar</button></div>`}</div>`).join('') || '<p class="muted">Nada encontrado.</p>';
      $('#list', body).querySelectorAll('[data-t]').forEach(b => b.onclick = () => lab(FUNCS[+b.dataset.t]));
    };
    $('#q', body).oninput = e => render(e.target.value); render('');
  } else if (tab === 'atalhos') {
    body.innerHTML = `<div class="card">${SHORTCUTS.map(([a, k]) => `<div class="kv"><span>${a}</span><span>${k}</span></div>`).join('')}</div><p class="muted" style="font-size:13.5px">Atalhos do Excel para computador. Alguns mudam conforme o idioma do Excel (indicados entre parênteses).</p>`;
  } else {
    body.innerHTML = ERRORS.map(([e, m, s]) => `<div class="fnc"><div class="fh"><b style="color:var(--red)">${e}</b></div><div style="margin-top:4px">${m}</div><div class="muted" style="margin-top:4px">Como resolver: ${s}</div></div>`).join('');
  }
}
function lab(f) {
  const md = modal(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">Laboratório: ${esc(f[0])}</h2><button class="btn small ghost" data-close>Fechar</button></div><p class="muted" style="font-size:14px">A fórmula está em F2. Mude os dados ou a fórmula e veja o resultado mudar.</p><div id="labsv"></div>`, { wide: true });
  const rows = LAB_DATA.map((r, i) => [...r, '', i === 0 ? 'Fórmula' : i === 1 ? f[5] : '']);
  const wb = wbFromSpec([{ name: 'Teste', rows, fmt: { 'D2:D6': 'brl' }, todo: ['F2'], w: { F: 170 } }]);
  new SheetView($('#labsv', md.el), wb, { mode: mode(), start: 'F2', minRows: 8, minCols: 6 });
}

/* ---------- sobre ---------- */
function viewAbout(el) {
  el.innerHTML = `<h1>Sobre e configurações</h1>
  <div class="card"><h2 style="margin-top:0">Onde você usa o app</h2><p class="muted" style="margin:0">Muda os controles da planilha e o passo a passo das missões.</p>${modesHtml(mode())}</div>
  <div class="card" style="margin-top:12px"><h2 style="margin-top:0">Aparência</h2><div class="tabs">${[['auto', 'Automático'], ['light', 'Claro'], ['dark', 'Escuro']].map(([k, l]) => `<button class="${S.theme === k ? 'on' : ''}" data-t="${k}">${l}</button>`).join('')}</div></div>
  <div class="card" style="margin-top:12px"><h2 style="margin-top:0">Seu progresso</h2><p class="muted">Seu progresso é só seu: fica salvo neste aparelho e neste navegador. Cada pessoa que usa o app no próprio celular ou computador começa do zero. Vai trocar de aparelho? Salve um arquivo de backup e restaure no aparelho novo.</p>
  <div class="row"><button class="btn ghost" id="exp">${ic('download')}Salvar meu progresso</button><button class="btn ghost" id="imp">${ic('refresh')}Restaurar de um arquivo</button><input type="file" id="impf" accept=".json,application/json" hidden></div>
  <div class="row" style="margin-top:10px"><button class="btn ghost" id="reset">Zerar todo o progresso</button></div></div>
  <div class="card" style="margin-top:12px"><h2 style="margin-top:0">Sobre</h2><p><b>Excel do Zero</b> — o aplicativo de prática do treinamento <b>Excel do Zero ao Expert</b>, que acompanha a apostila em PDF.</p>
  <p class="muted" style="font-size:14px">O simulador reproduz as fórmulas mais usadas do Excel em português (separador ; e vírgula decimal) para você treinar em qualquer aparelho. Alguns recursos do Excel de verdade (tabelas dinâmicas, gráficos, macros, matrizes dinâmicas) são ensinados na apostila e praticados no próprio Excel.</p>
  <p class="muted" style="font-size:13px">Material educativo independente, sem vínculo com a Microsoft. Excel é marca registrada da Microsoft Corporation.</p></div>`;
  el.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { S.theme = b.dataset.t; save(); applyTheme(); viewAbout(el); });
  el.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { S.mode = b.dataset.mode; save(); applyMode(); toast(S.mode === 'pc' ? 'Modo computador ativado' : 'Modo celular ativado'); viewAbout(el); });
  $('#exp', el).onclick = () => {
    const d = new Date(), stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const blob = new Blob([JSON.stringify({ app: 'excel-do-zero', v: 1, data: S })], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `progresso-excel-do-zero-${stamp}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Backup salvo. Guarde o arquivo para restaurar em outro aparelho.');
  };
  $('#imp', el).onclick = () => $('#impf', el).click();
  $('#impf', el).onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const j = JSON.parse(rd.result); if (j.app !== 'excel-do-zero' || !j.data || typeof j.data !== 'object') throw 0;
        confirmBox('Restaurar progresso?', 'O progresso atual deste aparelho será substituído pelo do arquivo.', 'Restaurar', () => { S = Object.assign({}, DEF, j.data); save(); applyTheme(); applyMode(); updateTop(); toast('Progresso restaurado'); go('home'); });
      } catch (err) { toast('Arquivo inválido. Use o arquivo gerado em "Salvar meu progresso".'); }
    };
    rd.readAsText(f);
  };
  $('#reset', el).onclick = () => confirmBox('Zerar progresso?', 'XP, missões, conquistas e a planilha livre serão apagados deste aparelho.', 'Zerar tudo', () => { const t = S.theme; S = { ...DEF, theme: t }; save(); updateTop(); go('home'); });
}

/* ---------- inicialização ---------- */
function onboarding() {
  if (S.onboard || /[?&]pular=1/.test(location.search)) return;
  let chosen = mode();
  const md = modal(`<div class="celebrate"><div class="em brand">XL</div><h2>Bem-vindo ao Excel do Zero!</h2><p>Aqui você aprende Excel <b>fazendo</b>: missões curtas com correção automática, XP, níveis e conquistas.</p>
    <p style="text-align:left;font-weight:700;margin:14px 0 0">Onde você vai usar o app?</p>${modesHtml(chosen)}
    <p style="text-align:left;font-weight:700;margin-bottom:6px">Qual é a sua área de trabalho?</p>
    <select id="obArea" class="search" style="margin-bottom:14px"><option value="">Prefiro escolher depois</option>${AREAS.map(a => `<option value="${a.id}">${a.icon} ${a.nome}</option>`).join('')}</select>
    <button class="btn block" id="obGo">Começar a primeira missão</button><p class="muted" style="font-size:13px;margin-bottom:0">Dá para trocar depois em Sobre e configurações.</p></div>`, { sticky: true });
  md.el.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { chosen = b.dataset.mode; md.el.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x === b)); });
  $('#obGo', md.el).onclick = () => { S.onboard = true; S.mode = chosen; S.area = $('#obArea', md.el).value || null; save(); applyMode(); md.close(); if (location.hash === '#/missao/b1') route(); else go('missao/b1'); };
}
function init() {
  applyTheme(); applyMode(); updateTop();
  window.addEventListener('hashchange', route); route(); onboarding();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body></html>
